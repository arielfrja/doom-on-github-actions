name: Build DOOM & Play in Browser

on:
  workflow_dispatch: # הפעלה ידנית מתוך לשונית Actions

jobs:
  build-and-play:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout id-Software/DOOM
        uses: actions/checkout@v4
        with:
          repository: id-Software/DOOM

      - name: Install Build Dependencies & Display Server
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libsdl2-dev \
            libsdl2-mixer-dev \
            xvfb \
            xfce4 \
            x11vnc \
            novnc \
            net-tools \
            curl \
            wget \
            doom-wad-shareware

      - name: Build DOOM Source Code
        run: |
          # התאמת קוד המקור המקורי מ-1997 לבנייה על לינוקס מודרני (32/64-bit)
          # במידה וקיים Makefile במאגר:
          cd linux
          make || true
          
          # במידה והבנייה המקורית של 1997 נכשלה בגלל התאמות C מודרניות,
          # נבנה פורט מבוסס SDL2 שמשתמש בליבת ה-Source Code של id-Software:
          if [ ! -f linuxxdoom ]; then
            echo "Falling back to compiling Chocolate-Doom binary directly from Linux environment..."
            sudo apt-get install -y chocolate-doom
            ln -s $(which chocolate-doom) linuxxdoom
          fi

      - name: Setup DOOM WAD File
        run: |
          # העתקת ה-WAD של DOOM לתקיית ההרצה
          mkdir -p ~/.chocolate-doom/
          cp /usr/share/games/doom/doom1.wad ./linux/ || true
          cp /usr/share/games/doom/doom1.wad ~/.chocolate-doom/ || true

      - name: Start Virtual Screen & Desktop
        run: |
          # הפעלת מסך וירטואלי ברזולוציה 1024x768
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          sleep 2
          DISPLAY=:99 startxfce4 > /dev/null 2>&1 &
          sleep 3

      - name: Launch DOOM Engine on Screen :99
        run: |
          # הרצת המשחק שקומפל על המסך הווירטואלי
          DISPLAY=:99 ./linux/linuxxdoom -iwad /usr/share/games/doom/doom1.wad &
          sleep 2

      - name: Start VNC & noVNC Web Server
        run: |
          # הפעלת שרת VNC על מסך 99
          x11vnc -display :99 -forever -shared -rfbport 5900 -bg
          # תרגום תקשורת ה-VNC ל-WebSockets עבור הדפדפן בפורט 6080
          /usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 &
          sleep 3

      - name: Expose Browser Link & Play DOOM
        run: |
          echo "======================================================="
          echo "    🎮 DOOM IS RUNNING! OPEN THE LINK BELOW: 🎮"
          echo "======================================================="
          
          # יצירת מנהרת HTTP מאובטחת החוצה דרך Pinggy לצורך חיבור מהדפדפן
          ssh -p 443 -R0:localhost:6080 -o StrictHostKeyChecking=no a.pinggy.io | tee pinggy.log &
          
          # השהייה לקבלת הקישור והדפסתו ללוג
          sleep 8
          cat pinggy.log | grep -o "https://.*\.pinggy\.link" | head -n 1 | awk '{print "PLAY HERE ---> " $1 "/vnc.html?autoconnect=true"}' || true
          
          echo "======================================================="
          echo "The game session will stay alive for up to 1 hour."
          echo "Keep this GitHub Action runner active to play."
          echo "======================================================="
          
          # שמירה על הרץ פעיל לצורך המשחק
          sleep 3600
