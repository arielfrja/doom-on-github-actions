name: Build DOOM & Play in Browser

on:
  workflow_dispatch: # הפעלה ידנית מתוך לשונית Actions

jobs:
  build-and-play:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout id-Software/DOOM
        uses: actions/checkout@v4
        with:
          repository: id-Software/DOOM

      - name: Install Build Dependencies & Display Server
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libsdl2-dev \
            libsdl2-mixer-dev \
            xvfb \
            x11vnc \
            novnc \
            net-tools \
            curl \
            wget \
            chocolate-doom \
            doom-wad-shareware

      - name: Build DOOM Source Code
        run: |
          # כניסה לתיקיית הקוד המקור שבה נמצאים הקבצים וה-Makefile
          cd linuxdoom-1.10
          
          # הרצת make עם דגלים שמתעלמים מבעיות טיפוסים ב-C ישן מול קומפיילר מודרני
          make -f Makefile CFLAGS="-g -Wall -Wno-implicit-int -Wno-implicit-function-declaration -Wno-return-type" || true
          
          cd ..

          # אם קובץ ההרצה לא נוצר עקב שגיאות קומפילציה, נגבה עם chocolate-doom ונשנה לו את השם
          if [ ! -f "linuxdoom-1.10/linuxxdoom" ] && [ ! -f "linuxdoom-1.10/doom" ]; then
            echo "Falling back to chocolate-doom..."
            ln -sf $(which chocolate-doom) linuxdoom-1.10/linuxxdoom
          fi

      - name: Start Virtual Screen (No XFCE)
        run: |
          # הפעלת מסך וירטואלי נקי ברזולוציה 1024x768 בלי שולחן עבודה כבד
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          sleep 2

      - name: Launch DOOM Engine on Screen :99
        run: |
          # הרצת המשחק ישירות על המסך הווירטואלי
          export DISPLAY=:99
          if [ -f "linuxdoom-1.10/linuxxdoom" ]; then
            cd linuxdoom-1.10
            ./linuxxdoom -iwad doom1.wad &
          else
            chocolate-doom -iwad /usr/share/games/doom/doom1.wad &
          fi
          sleep 2

      - name: Inject Mobile Touch Controls into noVNC
        run: |
          # הזרקת כפתורי מגע וידאו/מקלדת ישירות לממשק ה-noVNC עבור הטלפון
          sudo tee -a /usr/share/novnc/vnc.html > /dev/null << 'EOF'
          <style>
            #virtual-dpad {
              position: fixed;
              bottom: 20px;
              left: 20px;
              z-index: 999999;
              display: grid;
              grid-template-columns: repeat(3, 55px);
              grid-template-rows: repeat(3, 55px);
              gap: 5px;
              opacity: 0.85;
            }
            #virtual-actions {
              position: fixed;
              bottom: 20px;
              right: 20px;
              z-index: 999999;
              display: flex;
              gap: 10px;
              opacity: 0.85;
            }
            .v-btn {
              background: rgba(0, 0, 0, 0.7);
              color: white;
              border: 2px solid rgba(255, 255, 255, 0.8);
              border-radius: 12px;
              font-size: 20px;
              font-weight: bold;
              display: flex;
              align-items: center;
              justify-content: center;
              user-select: none;
              touch-action: manipulation;
            }
            .v-btn:active, .v-btn.pressed {
              background: rgba(255, 0, 0, 0.6);
              border-color: white;
            }
          </style>

          <div id="virtual-dpad">
            <div></div>
            <div class="v-btn" ontouchstart="pressKey('ArrowUp', this)" ontouchend="releaseKey('ArrowUp', this)">⬆️</div>
            <div></div>
            <div class="v-btn" ontouchstart="pressKey('ArrowLeft', this)" ontouchend="releaseKey('ArrowLeft', this)">⬅️</div>
            <div class="v-btn" ontouchstart="pressKey('ControlLeft', this)" ontouchend="releaseKey('ControlLeft', this)">🔥</div>
            <div class="v-btn" ontouchstart="pressKey('ArrowRight', this)" ontouchend="releaseKey('ArrowRight', this)">➡️</div>
            <div></div>
            <div class="v-btn" ontouchstart="pressKey('ArrowDown', this)" ontouchend="releaseKey('ArrowDown', this)">⬇️</div>
            <div></div>
          </div>

          <div id="virtual-actions">
            <div class="v-btn" style="width: 70px; height: 70px;" ontouchstart="pressKey('Space', this)" ontouchend="releaseKey('Space', this)">USE</div>
            <div class="v-btn" style="width: 70px; height: 70px;" ontouchstart="pressKey('ControlLeft', this)" ontouchend="releaseKey('ControlLeft', this)">FIRE</div>
          </div>

          <script>
            function pressKey(code, element) {
              element.classList.add('pressed');
              const event = new KeyboardEvent('keydown', {
                code: code,
                key: code.includes('Arrow') ? code.replace('Arrow', '') : (code === 'Space' ? ' ' : 'Control'),
                bubbles: true,
                cancelable: true
              });
              window.dispatchEvent(event);
              document.dispatchEvent(event);
            }
            function releaseKey(code, element) {
              element.classList.remove('pressed');
              const event = new KeyboardEvent('keyup', {
                code: code,
                key: code.includes('Arrow') ? code.replace('Arrow', '') : (code === 'Space' ? ' ' : 'Control'),
                bubbles: true,
                cancelable: true
              });
              window.dispatchEvent(event);
              document.dispatchEvent(event);
            }
          </script>
          </body>
          </html>
          EOF

      - name: Start VNC & noVNC Web Server
        run: |
          # הפעלת שרת VNC על מסך 99
          x11vnc -display :99 -forever -shared -rfbport 5900 -bg
          # תרגום תקשורת ה-VNC ל-WebSockets עבור הדפדפן בפורט 6080
          /usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 &
          sleep 3

      - name: Expose Browser Link & Play DOOM
        run: |
          echo "======================================================="
          echo "    🎮 DOOM IS RUNNING! OPEN THE LINK BELOW: 🎮"
          echo "======================================================="
          
          # יצירת מנהרת HTTP מאובטחת החוצה דרך Pinggy
          ssh -p
